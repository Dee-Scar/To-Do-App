<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do App with Timer & Dark Mode</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 To-Do App</h1>
      <button id="toggle-dark">🌙 Toggle Dark Mode</button>
    </header>

    <div class="todo-container">
      <input type="text" id="todo-input" placeholder="Add a new task..." />
      <input type="time" id="todo-time" />
      <button id="add-btn">Add Task</button>
    </div>

    <ul id="todo-list"></ul>
  </div>


  <audio id="alarm-sound" src="./Journey(chosic.com).mp3" preload="auto"></audio>


  <footer>
    <p>© 2025 To-Do App | Built by You</p>
  </footer>

  <audio id="alarm-sound" src="https://www.soundjay.com/button/beep-07.wav" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
